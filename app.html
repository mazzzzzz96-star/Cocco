const clipLoad=onp=>_clip||(_clip=(async()=>{let st='AI library (cdn.jsdelivr.net)';
 try{const T=await import(CDN);T.env.allowLocalModels=true;T.env.localModelPath='models/';
  st='model settings (huggingface.co)';const proc=await T.AutoProcessor.from_pretrained(MODEL);
  st='model file, about 90 MB (huggingface.co)';const model=await T.CLIPVisionModelWithProjection.from_pretrained(MODEL,{dtype:'q8',progress_callback:onp});
  return{T,proc,model}}catch(e){throw new Error('failed at '+st+': '+(e&&e.message||e))}})().catch(e=>{_clip=null;throw e}));
async function embed(blob,onp){const{T,proc,model}=await clipLoad(onp);
 const img=await T.RawImage.fromBlob(blob),inp=await proc(img),out=await model(inp);
 const d=Float32Array.from(out.image_embeds.data);let n=0;for(const v of d)n+=v*v;n=Math.sqrt(n)||1;return d.map(v=>v/n)}
const keyFrom=async(pw,salt)=>{const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
async function dec(buf,pw){buf=new Uint8Array(buf);const k=await keyFrom(pw,buf.slice(0,16));
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(16,28)},k,buf.slice(28));return JSON.parse(new TextDecoder().decode(pt))}

const BASEN=PESTS.length,b64i8=x=>{const b=atob(x),a=new Int8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};

const same=(a,b)=>{a=a.toLowerCase().trim();b=b.toLowerCase().trim();return a===b||a.startsWith(b+' ')||b.startsWith(a+' ')};
function clearLib(){LIBX=null;RM=null;RL=null;PESTS.length=BASEN;PESTS.forEach(p=>{delete p.th;delete p.note})}
function setLib(o){clearLib();LIBX=o;const n=o.dim||512;let tot=0;o.species.forEach(x=>tot+=x.n);
 RM=new Float32Array(tot*n);RL=new Int32Array(tot);let r=0;
 o.species.forEach(x=>{let pi=PESTS.findIndex((p,i)=>i<BASEN&&same(p.s,x.name));
  if(pi<0){PESTS.push({n:{fa:x.name,en:x.name},s:x.name,d:{fa:'',en:''},c:{fa:'',en:''}});pi=PESTS.length-1}
  PESTS[pi].th=x.th||'';PESTS[pi].note=x.info||'';
  const q=b64i8(x.e);
  for(let k=0;k<x.n;k++){let nn=0;for(let j=0;j<n;j++){const v=q[k*n+j]/127;RM[r*n+j]=v;nn+=v*v}nn=Math.sqrt(nn)||1;for(let j=0;j<n;j++)RM[r*n+j]/=nn;RL[r++]=pi}})}
async function unlock(key){let miss=0;
 for(const L of [3,2,1]){let buf;
  try{const r=await fetch(`lib/lib${L}.enc`,{cache:'no-cache'});if(!r.ok)throw 0;buf=await r.arrayBuffer()}catch(e){miss++;continue}
  try{setLib(await dec(buf,key));user={e:'••••'+key.slice(-4),l:L};ls.s('user',user);ls.s('key',key);return L}catch(e){}}
 return miss===3?'nolib':0}

async function detect(fs,onp,onstep){
 if(API){const f=new FormData();fs.forEach(x=>f.append('images',x));const r=await fetch(API,{method:'POST',body:f});return r.json()}
 if(!RM)throw new Error('lib');
 const n=LIBX.dim||512,N=RL.length,np=PESTS.length,acc=new Float64Array(np),has=new Uint8Array(np);
 for(let r=0;r<N;r++)has[RL[r]]=1;
 for(let f=0;f<fs.length;f++){onstep&&onstep(f+1,fs.length);const q=await embed(fs[f],onp);
  const top=PESTS.map(()=>[-1,-1,-1]);
  for(let r=0;r<N;r++){let sc=0;const o=r*n;for(let j=0;j<n;j++)sc+=RM[o+j]*q[j];const b=top[RL[r]];if(sc>b[2]){b[2]=sc;b.sort((x,y)=>y-x)}}
  top.forEach((b,i)=>{if(!has[i])return;const v=b.filter(x=>x>-1);acc[i]+=v.reduce((x,y)=>x+y,0)/v.length/fs.length})}
 const ids=[...has.keys()].filter(i=>has[i]).sort((a,b)=>acc[b]-acc[a]),T=0.03,mx=acc[ids[0]];
 const ex=ids.map(i=>Math.exp((acc[i]-mx)/T)),sum=ex.reduce((a,b)=>a+b,0),pc=ex.map(v=>Math.round(v/sum*100));
 const res={i:ids[0],c:Math.max(1,pc[0]),w:acc[ids[0]]<0.7};
 if(ids.length>1&&pc[1]>=10)res.a={i:ids[1],c:pc[1]};
 return res}

 const A=[...PESTS.map((p,i)=>({k:'pest',i,n:p.n,s:p.s,m:[p.n.fa,p.n.en,p.s]})),...PRODS.map(x=>({k:'prod',i:x.id,n:x.n,s:x.b[lang],m:[x.n.fa,x.n.en]}))];
 const ex=A.filter(x=>x.m.some(y=>nz(y).includes(q)));srExact=ex.length>0;
 const sg=ex.length?[]:A.map(x=>[Math.min(...x.m.map(y=>dist(q,nz(y)))),x]).filter(a=>a[0]<=.4).sort((a,z)=>a[0]-z[0]).slice(0,2).map(a=>a[1]);
 b.innerHTML=(ans?`<div class="fld" style="padding:12px 18px;margin:10px 0"><p style="color:var(--tx);margin:0">${esc(ans)}</p></div>`:'')+(ex.length?ex.map(sRow).join(''):sg.length?`<p style="margin-top:14px">${t('mean')}</p>`+sg.map(sRow).join(''):(ans?'':`<p class="ctr" style="margin-top:20px">${t('none')}</p>`))}
async function ask(q){ans='…';renderSR();try{const r=await fetch(CHAT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q,lang})});ans=String((await r.json()).a||'').trim()||t('chat_err')}catch(e){ans=t('chat_err')}renderSR()}
function sendQ(){const q=$('#q').value.trim();if(!q)return;const r=$('#sr .row');
 if(r&&srExact){r.click();return}
 if(CHAT){if(!user){toast(t('need_login'));go('me');return}ask(q);return}
 if(r)r.click()}
$('#q').oninput=()=>{ans='';renderCnt();renderSR();renderTip()};
$('#q').onkeydown=e=>{if(e.key==='Enter'&&!files.length)sendQ()};
const add=l=>{for(const f of l){if(files.length>=MAX)break;if(f.type.startsWith('image/'))files.push(Object.assign(f,{u:URL.createObjectURL(f)}))}renderCnt();renderSR()};
$('#fCam').onchange=e=>{add(e.target.files);e.target.value=''};$('#fGal').onchange=e=>{add(e.target.files);e.target.value=''};
const getLoc=()=>new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>r({a:+p.coords.latitude.toFixed(4),o:+p.coords.longitude.toFixed(4)}),()=>r(null),{timeout:4000}):r(null));
const thumb=f=>new Promise(r=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=64;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,64,64);r(c.toDataURL('image/jpeg',.6))};im.onerror=()=>r('');im.src=f.u});
async function analyze(){const lp=useLoc?getLoc():Promise.resolve(null);
 view('proc');$('#scanimg').src=files[0].u;$('#bar').style.width='0';$('#stg').textContent=t('ld_model');
 let d;
 try{if(libReady)await libReady;
  d=await detect(files,p=>{if(p&&p.status==='progress'&&p.progress!=null){$('#stg').textContent=t('ld_model');$('#bar').style.width=Math.round(p.progress)+'%'}},(i,n)=>{$('#stg').textContent=t('an')(i,n);$('#bar').style.width=(i/n*100)+'%'})}
 catch(e){console.error(e);view('home');toast(t('err_ai'));return}
 const loc=await lp;result={...d,loc};
 hist.unshift({ts:Date.now(),i:d.i,c:d.c,loc,th:await thumb(files[0])});hist=hist.slice(0,50);ls.s('hist',hist);
 view('res');renderRes();renderHist();$('main').scrollTop=0}
const prodsFor=i=>{const it=lib.items.find(x=>x.i===i);return it?it.prods:[0,1,3]};
function pestDetail(i){const p=PESTS[i],it=lib.items.find(x=>x.i===i);let h=`<p style="color:var(--tx)">${p.c[lang]}</p>`;
 if(p.note)h+=`<h3>${t('notes')}</h3><p style="color:var(--tx);white-space:pre-line">${esc(p.note)}</p>`;
 if(it)h+=`<h3>${t('life')}</h3><p style="color:var(--tx)">${it.life[lang]}</p><h3>${t('enemy')}</h3><p style="color:var(--tx)">${it.enemy[lang]}</p><h3>${t('ctl')}</h3><ul>${it.ctl[lang].map(x=>`<li>${x}</li>`).join('')}</ul>`;
 return h}
function medsBlock(i){return `<h3>${t('rel')}</h3>`+prodsFor(i).map(id=>`<div class="row" data-prod="${id}"><div class="g"><b>${PRODS[id].n[lang]}</b><p>${PRODS[id].k[lang]}</p></div><button class="rb d" data-ord="${id}" aria-label="add" style="width:34px;height:34px">${ico('plus')}</button></div>`).join('')+`<button class="btn" data-addall="${i}">${t('add_all')}</button><p class="note">${t('lab')}</p>`}
function addAll(i){if(needLogin())return;prodsFor(i).forEach(id=>{const c=cart.find(x=>x.id===id);c?c.q++:cart.push({id,q:1})});ls.s('cart',cart);head();renderMe();renderProd();toast(t('add_ok'))}
function renderRes(){if(!result||!PESTS[result.i])return;const p=PESTS[result.i];
 $('#res').innerHTML=`<div style="padding-top:12px"><button class="lk" data-act="new" style="display:flex;align-items:center;gap:4px;padding:6px 0">${ico('back','fl')}${t('scan')}</button><p style="margin:14px 0 0">${t('conf')} ${result.c}%</p><h2 style="font-size:26px">${p.n[lang]}</h2><p class="sci">${p.s}</p><p style="margin-top:10px">${p.d[lang]}</p>${result.w?`<p style="color:#c0392b">${t('lowc')}</p>`:''}${result.a&&PESTS[result.a.i]?`<p>${t('alt')}: ${PESTS[result.a.i].n[lang]} (${result.a.c}%)</p>`:''}${pestDetail(result.i)}${medsBlock(result.i)}<p class="note ctr">${t('demo')}</p><div class="ctr"><button class="lk" data-act="share">${t('send')}</button></div></div>`}

/* pests: list + one-line summary for everyone; full details need an account */
const LOCK=`<div class="lockv" style="padding:36px 10px">${ico('lock')}<p style="margin-top:8px">${t('unlock')}</p><button class="btn" data-go="me" style="max-width:240px;margin:14px auto 0">${t('l_in')}</button></div>`;
const backBtn=l=>`<button class="lk" data-act="back" style="display:flex;align-items:center;gap:4px;padding:6px 0">${ico('back','fl')}${l}</button>`;
const pic=(src,sym,cls='')=>`<div class="im ${cls}">${ico(sym)}<img src="${src}" alt="" onerror="this.remove()"></div>`;
const moreBtn=f=>`<div class="ctr" style="margin-top:18px">${f&&user?`<p>${t('more_msg')}</p>`:`<button class="btn o" data-act="more">${t('more')}</button>`}</div>`;
function renderPests(){const b=$('#pestBox');
 if(pv==null){b.innerHTML=`<div class="grid2">${(moreP&&user?PESTS:PESTS.slice(0,3)).map((p,i)=>`<div class="pc" data-pest="${i}">${pic(p.th||'samples/'+i+'.jpg','bug')}<div class="tx"><b>${p.n[lang]}</b><span class="sci" style="font-size:15px">${p.s}</span></div></div>`).join('')}</div>${moreBtn(moreP)}`;return}
 const p=PESTS[pv],it=lib.items.find(x=>x.i===pv);
 let h=backBtn(t('pests'))+pic(p.th||'samples/'+pv+'.jpg','bug','hero')+`<h2 style="font-size:26px">${p.n[lang]}</h2><p class="sci">${p.s}</p><p style="margin-top:8px">${p.d[lang]}</p><p style="color:var(--tx)">${p.c[lang]}</p>`;
 if(!user)h+=LOCK;else{if(p.note)h+=`<h3>${t('notes')}</h3><p style="color:var(--tx);white-space:pre-line">${esc(p.note)}</p>`;
  if(it){h+=`<h3>${t('life')}</h3><p style="color:var(--tx)">${it.life[lang]}</p><h3>${t('enemy')}</h3>`+`<p style="color:var(--tx)">${it.enemy[lang]}</p>`+
  `<h3>${t('ctl')}</h3><ul>${it.ctl[lang].map(x=>`<li>${x}</li>`).join('')}</ul><h3>${t('rel')}</h3><div class="chips">${it.prods.map(id=>`<button class="chip" data-prod="${id}" style="color:var(--tx)">${PRODS[id].n[lang]}</button>`).join('')}</div>`}}
 b.innerHTML=h}

/* products: cards with order button, names only (no pest grouping); full details need an account */
function cartBox(){const on=user&&cart.length;return `<h3 class="sh">${t('cart')}</h3><div style="background:var(--fl);border-radius:18px;padding:4px 14px 14px">`+(on?cart.map(c=>`<div class="row" style="cursor:default"><div class="g"><b>${PRODS[c.id].n[lang]}</b></div><button class="chip" data-cq="${c.id},-1">−</button><b>${c.q}</b><button class="chip" data-cq="${c.id},1">+</button><button data-cd="${c.id}" style="color:var(--mu)">${ico('x')}</button></div>`).join(''):`<p style="padding:14px 0;text-align:center">${t('cart_empty')}</p>`)+`<button class="btn" data-sub="1"${on?'':' disabled'}>${t('submit')}</button></div>`}
function renderProd(){const b=$('#prodBox');
 if(pd==null){b.innerHTML=cartBox()+`<h3 class="sh">${t('meds')}</h3><div class="grid2">${(moreD&&user?PRODS:PRODS.slice(0,4)).map(x=>`<div class="pc" data-prod="${x.id}">${pic('products/'+x.id+'.jpg','bottle')}<div class="tx"><b>${x.n[lang]}</b><span class="mu">${x.b[lang]}</span><span class="mu">${x.k[lang]}</span></div><button class="rb d" data-ord="${x.id}" aria-label="add" style="align-self:center;margin:0 10px">${ico('plus')}</button></div>`).join('')}</div>${moreBtn(moreD)}`;return}
 const x=PRODS[pd];
 b.innerHTML=backBtn(t('prod'))+pic('products/'+x.id+'.jpg','bottle','hero')+`<h2 style="font-size:26px">${x.n[lang]}</h2><p>${x.b[lang]} · ${x.k[lang]}</p><p style="color:var(--tx);margin-top:8px">${x.l[lang]}</p><button class="btn" data-ord="${x.id}">${t('ord')}</button>`+
 (user?`<h3></h3>${x.x[lang].map(l=>`<p style="color:var(--tx)">• ${l}</p>`).join('')}<p class="note">${t('lab')}</p>`:LOCK)}
function needLogin(){if(user)return false;toast(t('ord_login'));go('me');return true}
function addCart(id){if(needLogin())return;const c=cart.find(x=>x.id===id);c?c.q++:cart.push({id,q:1});ls.s('cart',cart);head();renderMe();renderProd();toast(t('add_ok'))}
function submitCart(){if(!cart.length)return;orders.unshift(...cart.map(c=>({id:c.id,q:c.q,nm:cn,ph:cp,ts:Date.now()})));ls.s('ord',orders);cart=[];ls.s('cart',cart);head();renderMe();renderProd();toast(t('ord_ok'))}

/* activity tab: history, spray reminders and orders as stacked sections */
function renderHist(){const b=$('#histBox'),today=new Date().toISOString().slice(0,10);
 const hs=!hist.length?`<p>${t('h_empty')}</p>`:hist.map((h,k)=>!PESTS[h.i]?'':`<div class="row" data-pest="${h.i}"><img class="t" src="${h.th}" alt=""><div class="g"><b>${PESTS[h.i].n[lang]}</b><p>${dt(h.ts)} · ${h.c}%</p></div>${h.loc?`<a class="lk" onclick="event.stopPropagation()" href="https://maps.google.com/?q=${h.loc.a},${h.loc.o}" target="_blank" rel="noopener">${ico('pin')}</a>`:''}<button data-dh="${k}" style="color:var(--mu)">${ico('x')}</button></div>`).join('')+`<button class="lk" data-act="hclr" style="margin-top:6px">${t('h_clear')}</button>`;
 const rs=`<p>${t('rm_p')}</p><input type="date" id="rd"><input id="rn" placeholder="${t('rm_n')}"><button class="btn" data-act="radd">${t('rm_add')}</button>`+[...rems].sort((a,z)=>a.d>z.d?1:-1).map(r=>`<div class="row" style="cursor:default"><div class="g"><b class="${r.d<today?'late':''}">${r.d}</b><p>${r.n}</p></div><button data-dr="${r.id}" style="color:var(--mu)">${ico('x')}</button></div>`).join('');
 b.innerHTML=`<h3 class="sh">${t('hist_l')}</h3>${hs}<h3 class="sh">${t('rm')}</h3>${rs}`}

/* profile: access key, cart, orders, about */
function renderMe(){const b=$('#meBox');
 let h=user?`<div class="row" style="cursor:default"><div class="ic">${ico('user')}</div><div class="g"><b>${user.e}</b><p>${t('r'+user.l)}</p></div><button class="lk" data-act="logout">${t('l_out')}</button></div>`
 :`<p>${t('l_why')}</p><input id="kk" dir="ltr" autocomplete="off" placeholder="${t('l_key')}" style="text-align:center;letter-spacing:2px"><button class="btn" data-act="login">${t('l_in')}</button>`;
 b.innerHTML=h+`<p style="margin-top:24px">${t('a_p')} · v0.5</p>`}
document.addEventListener('input',e=>{if(e.target.id==='cn')cn=e.target.value;if(e.target.id==='cp')cp=e.target.value});

/* one delegated click handler */
document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let x;
 if(!q('.pw'))$('#addMenu').classList.add('hide');
 if(x=q('[data-go]')){if(x.dataset.go==='scan'&&!$('#v-res').classList.contains('hide'))resetScan();if(x.dataset.go===page){pv=null;pd=null}go(x.dataset.go);renderPests();renderProd();head();return}
 if(x=q('[data-ord]')){addCart(+x.dataset.ord);return}
 if(x=q('[data-addall]')){addAll(+x.dataset.addall);return}
 if(x=q('[data-cq]')){const[id,d]=x.dataset.cq.split(',').map(Number),c=cart.find(z=>z.id===id);c.q+=d;if(c.q<1)cart=cart.filter(z=>z.id!==id);ls.s('cart',cart);head();renderMe();renderProd();return}
 if(x=q('[data-cd]')){cart=cart.filter(z=>z.id!=x.dataset.cd);ls.s('cart',cart);head();renderMe();renderProd();return}
 if(x=q('[data-dh]')){e.stopPropagation();hist.splice(x.dataset.dh,1);ls.s('hist',hist);renderHist();return}
 if(x=q('[data-pest]')){openPest(+x.dataset.pest);return}
 if(x=q('[data-prod]')){openProd(+x.dataset.prod);return}
 if(x=q('[data-sub]')){submitCart();return}
 if(x=q('[data-rm]')){URL.revokeObjectURL(files[x.dataset.rm].u);files.splice(x.dataset.rm,1);renderCnt();renderSR();return}
 if(x=q('[data-dr]')){rems=rems.filter(r=>r.id!=x.dataset.dr);ls.s('rem',rems);renderHist();return}
 if(x=q('[data-af]')){af=x.dataset.af;renderHist();return}
 if(q('#sheetBg')){closeSheet();return}
 if(!(x=q('[data-act]')))return;
 ({plus:()=>$('#addMenu').classList.toggle('hide'),
 cam:()=>{$('#addMenu').classList.add('hide');$('#fCam').click()},gal:()=>{$('#addMenu').classList.add('hide');$('#fGal').click()},
 loc:()=>{useLoc=!useLoc;renderCnt()},go:()=>{if(files.length){if(!user){toast(t('need_login'));go('me');return}analyze()}else sendQ()},
 new:resetScan,
 share:async()=>{const p=PESTS[result.i],s=`CoccoBye: ${p.n[lang]} (${p.s}) ${result.c}%`+(result.loc?` https://maps.google.com/?q=${result.loc.a},${result.loc.o}`:'');if(navigator.share){try{await navigator.share({title:'CoccoBye',text:s})}catch(_){}}else location.href='mailto:?subject=CoccoBye&body='+encodeURIComponent(s)},
 cart:()=>{if(needLogin())return;go('me');renderMe();setTimeout(()=>{const e=$('#cartSec');if(e)e.scrollIntoView()},60)},
 more:()=>{if(!user){toast(t('more_login'));go('me');return}if(page==='prod'){moreD=true;renderProd()}else{moreP=true;renderPests()}},
 back:()=>{if(page==='prod'){pd=null;renderProd()}else{pv=null;renderPests()}head()},lang:()=>{lang=lang==='fa'?'en':'fa';applyLang()},
 hclr:()=>{hist=[];ls.s('hist',hist);renderHist()},
 login:async()=>{const k=$('#kk').value.trim();if(k.length<6)return toast(t('l_bad'));toast(t('chk'));const r=await unlock(k);if(r==='nolib')return toast(t('l_nolib'));if(!r)return toast(t('l_bad'));applyLang()},
 logout:()=>{user=null;moreP=moreD=false;clearLib();result=null;ls.s('user',null);ls.s('key',null);view('home');applyLang()},
 radd:()=>{const d=$('#rd').value;if(!d)return;rems.push({id:Date.now(),d,n:$('#rn').value.trim()});ls.s('rem',rems);renderHist()},
 edit:()=>toast('Server needed')}[x.dataset.act]||(()=>{}))()});

go('scan');applyLang();
{const k=ls.g('key',null);if(user&&k){libReady=unlock(k).then(r=>{libReady=null;if(r===0){user=null;ls.s('user',null);ls.s('key',null)}applyLang()})}else if(user){user=null;ls.s('user',null);applyLang()}}
setTimeout(()=>{$('#splash').style.opacity=0;setTimeout(()=>$('#splash').remove(),550)},2400);
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
